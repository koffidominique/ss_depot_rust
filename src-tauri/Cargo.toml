[package]
name = "depotpro-desktop"
version = "3.0.0"
description = "DEPOTPRO ERP Desktop Application"
edition = "2021"

[lib]
name = "depotpro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
depotpro-core = { path = "../crates/depotpro-core" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
